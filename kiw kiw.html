<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Novita ❤️</title>

<!-- Menggunakan Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: #050510; /* Warna langit malam yang gelap pekat */
    overflow:hidden;
    position: relative;
}

/* Canvas untuk background bintang */
#starCanvas {
    position: absolute;
    inset: 0;
    z-index: 1;
}

.container{
    position:relative;
    text-align:center;
    z-index: 2; /* Di atas canvas bintang */
    padding: 20px;
}

.name{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-bottom:25px;
}

.letter{
    font-size:75px;
    font-weight:700;
    color:rgba(255, 255, 255, 0.15);
    transition: all 0.4s ease;
}

/* Efek glow putih keperakan yang mewah seperti bintang */
.letter.active{
    color: #fff;
    opacity:1;
    transform: translateY(-10px) scale(1.1);
    text-shadow:
    0 0 10px #fff,
    0 0 20px #e0f2fe,
    0 0 40px #38bdf8,
    0 0 60px #0369a1;
}

.text{
    color:white;
    font-size:22px;
    margin-bottom:30px;
    font-weight: 300;
    letter-spacing: 1px;
}

button{
    padding:14px 35px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    font-weight: 600;
    background: linear-gradient(45deg, #ff416c, #ff4b2b); /* Warna gradasi cinta */
    color: white;
    box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
    transition: all 0.3s ease;
}

button:hover{
    transform:scale(1.08);
    box-shadow: 0 8px 25px rgba(255, 75, 43, 0.6);
}
</style>
</head>

<body>

<!-- Canvas untuk Bintang Kelap-Kelip -->
<canvas id="starCanvas"></canvas>

<div class="container">
    <div class="name">
        <span class="letter">N</span>
        <span class="letter">O</span>
        <span class="letter">V</span>
        <span class="letter">I</span>
        <span class="letter">T</span>
        <span class="letter">A</span>
    </div>

    <div class="text">
        Aku ada hadiah spesial buat kamu ❤️
    </div>

    <button onclick="openGift()">
        Klik Disini
    </button>
</div>

<script>
// --- Animasi Huruf Menyala + Lompat ---
const letters = document.querySelectorAll('.letter');
let current = 0;

setInterval(() => {
    letters.forEach(letter => {
        letter.classList.remove('active');
    });

    letters[current].classList.add('active');

    current++;
    if(current >= letters.length){
        current = 0;
    }
}, 600);

// --- Fungsi untuk pindah ke website tujuan ---
function openGift(){
    window.location.href = "https://zroo-code.github.io/Noo/novitaaaa.html";
}

// --- Engine Background Bintang Kelap-Kelip ---
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const stars = [];
class Star {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2;
        this.twinkleSpeed = Math.random() * 0.03 + 0.01;
        this.opacity = Math.random();
        this.factor = 1;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    update() {
        if (this.opacity >= 1) this.factor = -1;
        if (this.opacity <= 0.2) this.factor = 1;
        this.opacity += this.twinkleSpeed * this.factor;
    }
}

// Membuat 150 bintang acak di layar
for (let i = 0; i < 150; i++) {
    stars.push(new Star());
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(star => {
        star.update();
        star.draw();
    });
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
